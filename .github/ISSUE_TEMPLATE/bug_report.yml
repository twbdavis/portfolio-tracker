name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: App version or commit, operating system, and browser if applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictional sample data; do not include private records or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant error text or a screenshot with private information removed.
    validations:
      required: true
